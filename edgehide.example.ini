; EdgeFlow v1.0.0 - example configuration
;
; Copy this file next to EdgeFlow.exe and rename it to "edgehide.ini".
; EdgeFlow reads and rewrites edgehide.ini at runtime; this example is only
; a starting point and is never modified by the application.
;
; All values shown below are the built-in defaults.

[Global]
; Master switch. When false, EdgeFlow ignores all windows and restores any
; window it has hidden.
Enabled=true
; Automatically dock a window dragged near a screen edge.
AutoDock=true
; Automatically hide a docked window after it loses focus and the mouse leaves.
AutoHide=true
; Reserved for classic edge auto-hide interaction tuning.
QQStyle=true

[Edge]
; Which edges may be used for docking.
Left=true
Right=true
Top=true
Bottom=true
; Reserved: corner docking. Corners are currently treated as plain edges.
Corners=true
; Distance from the edge (device-independent pixels) that counts as "near".
DockDistanceDip=20
; Magnetic capture range. Releasing the mouse inside this range docks the window.
MagnetDistanceDip=40
; Width of the edge hot zone (pixels) that reveals a hidden window.
RevealZonePx=15
; How many pixels of a hidden window remain on screen.
VisiblePixels=5

[Animation]
; Delay after focus loss + mouse leave before a docked window starts hiding.
HideDelayMs=280
; Duration of one hide or reveal animation.
AnimationTimeMs=230
; Polling interval used for state checks while no animation is running.
; Animation itself is driven by a high-resolution timer, not by this value.
IdleIntervalMs=80

[Behavior]
; Suppress reveal while a fullscreen window covers the whole monitor.
FullscreenGuard=true
; Manage ordinary windows globally without pre-registering them.
GlobalAutoManage=true

[HotCorner]
; Reserved. Trigger framework only; no action is bound in v1.0.0.
Enabled=false
LeftTop=false
RightTop=false
LeftBottom=false
RightBottom=false
TriggerDelayMs=250

[Debug]
; When true, EdgeFlow appends diagnostics to debug.log next to the EXE.
DebugLog=false

[Blacklist]
; Windows listed here are never managed.
; Keys prefixed with "Process" match the executable name,
; keys prefixed with "Class" match the window class name.
; Process1=game.exe
; Class1=SomeWindowClass

; Per-window exclusions created by Ctrl+Alt+H are stored in [IgnoredN] sections.
